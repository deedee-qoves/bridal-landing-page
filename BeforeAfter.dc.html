<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Before and projection slider</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"PP Neue Montreal";src:url("./assets/1f362b820cb3024cee63b02124ee6e08.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap;}
body{margin:0}
.ba{position:relative;width:100%;height:100%;border-radius:14px;overflow:hidden;background:#B4C1C8;font-family:"PP Neue Montreal",-apple-system,"Helvetica Neue",Arial,sans-serif;user-select:none;touch-action:none}
.ba-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ba-layer img{width:100%;height:100%;object-fit:cover;display:block}
.ba-ph{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:#fff;letter-spacing:.02em}
.ba-ph svg{width:32px;height:32px}
.ba-label{position:absolute;top:24px;font-size:17px;color:#fff;text-transform:uppercase;letter-spacing:.01em;z-index:3;pointer-events:none;text-shadow:0 1px 8px rgba(35,49,55,.35)}
.ba-label sup{font-size:12px;margin-left:4px}
.ba-line{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.9);transform:translateX(-1px);z-index:3;pointer-events:none}
.ba-knob{position:absolute;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid #fff;background:rgba(35,49,55,.15);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;gap:2px;z-index:4;pointer-events:none}
.ba-knob svg{width:10px;height:10px;fill:#fff}
.ba-range{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;z-index:5}
</style>
</helmet>
<div style="width: 100%; aspect-ratio: 760 / 960; box-sizing: border-box;">
<div class="ba">
<div class="ba-layer" style="background: #C4D8DF;">
<img src="./assets/9f9994cb4be2c3c61be788732133e69d.jpg" alt="Projection: the same woman on her wedding day, with a soft low updo, glowing skin and a satin top" draggable="false">
</div>
<div class="ba-layer" style="background: #C4D8DF; clip-path: {{beforeClip}};">
<img src="./assets/f7143173a9278e93c0f2a3642d46bb72.jpg" alt="Before: woman with loose hair and no makeup" draggable="false">
</div>
<span class="ba-label" style="left: 32px; font-size: 15px">Before</span>
<span class="ba-label" style="right: 32px; font-size: 15px">Projection<sup>(3)</sup></span>
<div class="ba-line" style="left: {{posPct}};"></div>
<div class="ba-knob" style="left: {{posPct}};"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M7 1L2 5l5 4z"></path></svg><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1l5 4-5 4z"></path></svg></div>
<input class="ba-range" type="range" min="0" max="100" step="0.5" value="{{pos}}" onInput="{{onSlide}}" onChange="{{onSlide}}" aria-label="Drag to compare before and projection">
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const pos = (this.state && this.state.pos != null) ? this.state.pos : 50;
return {
pos: pos,
posPct: pos + '%',
beforeClip: 'inset(0 ' + (100 - pos) + '% 0 0)',
onSlide: (e) => this.setState({ pos: Number(e.target.value) })
};
}
}
</script>
</body>
</html>
